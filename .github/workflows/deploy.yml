name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Pages + Workers
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Ensure D1 database exists in current account
        run: |
          set -euo pipefail

          DB_ID=$(npx wrangler d1 list --json | node -e '
            let input = "";
            process.stdin.on("data", c => input += c);
            process.stdin.on("end", () => {
              const list = JSON.parse(input);
              const db = Array.isArray(list) ? list.find(item => item.name === "cforum-db") : null;
              process.stdout.write(db?.uuid ?? "");
            });
          ')

          if [ -z "$DB_ID" ]; then
            echo "🆕 D1 database cforum-db not found in this account, creating..."
            npx wrangler d1 create cforum-db
            DB_ID=$(npx wrangler d1 list --json | node -e '
              let input = "";
              process.stdin.on("data", c => input += c);
              process.stdin.on("end", () => {
                const list = JSON.parse(input);
                const db = Array.isArray(list) ? list.find(item => item.name === "cforum-db") : null;
                process.stdout.write(db?.uuid ?? "");
              });
            ')
          fi

          if [ -z "$DB_ID" ]; then
            echo "❌ Failed to resolve D1 database id for cforum-db"
            exit 1
          fi

          sed -i -E "s/\"database_id\": \"[^\"]+\"/\"database_id\": \"$DB_ID\"/" wrangler.jsonc
          echo "✅ Using D1 database id: $DB_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: |
          set -euo pipefail

          echo "🗄️ Applying D1 migrations..."
          npx wrangler d1 migrations apply cforum-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers and Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --env=""
          secrets: |
            JWT_SECRET
            SUPABASE_URL
            SUPABASE_BUCKET
            SUPABASE_SERVICE_ROLE_KEY
            RESEND_KEY
            RESEND_SEND
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          RESEND_SEND: ${{ secrets.RESEND_SEND }}

      - name: Upload Supabase Storage secrets
        run: |
          set -euo pipefail

          missing=0
          for name in SUPABASE_URL SUPABASE_BUCKET SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::$name is not configured in GitHub repository secrets"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "🖼️ Uploading Supabase Storage configuration..."
          npx wrangler secret put SUPABASE_URL --env="" <<< "$SUPABASE_URL"
          npx wrangler secret put SUPABASE_BUCKET --env="" <<< "$SUPABASE_BUCKET"
          npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env="" <<< "$SUPABASE_SERVICE_ROLE_KEY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload Turnstile secrets (optional)
        run: |
          if [ -n "$TURNSTILE_SITE_KEY" ]; then
            echo "🔐 Uploading Turnstile configuration..."
            npx wrangler secret put TURNSTILE_SITE_KEY --env="" <<< "$TURNSTILE_SITE_KEY"
            npx wrangler secret put TURNSTILE_SECRET_KEY --env="" <<< "$TURNSTILE_SECRET_KEY"
          else
            echo "⏭️  Skipping Turnstile configuration (not configured)"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

      - name: Upload BASE_URL (optional)
        run: |
          if [ -n "$BASE_URL" ]; then
            echo "🌐 Uploading BASE_URL configuration..."
            npx wrangler secret put BASE_URL --env="" <<< "$BASE_URL"
          else
            echo "⏭️  Skipping BASE_URL configuration (will use request origin)"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Upload QQ login bridge secrets (optional)
        run: |
          set -euo pipefail

          if [ -n "$QQ_BOT_AUTH_URL" ] || [ -n "$CFORUM_AUTH_TOKEN" ]; then
            if [ -z "$QQ_BOT_AUTH_URL" ]; then
              echo "::error title=Missing GitHub secret::QQ_BOT_AUTH_URL is required when CFORUM_AUTH_TOKEN is configured"
              exit 1
            fi
            if [ -z "$CFORUM_AUTH_TOKEN" ]; then
              echo "::error title=Missing GitHub secret::CFORUM_AUTH_TOKEN is required when QQ_BOT_AUTH_URL is configured"
              exit 1
            fi
            if [[ "$QQ_BOT_AUTH_URL" != http* ]]; then
              echo "::error title=Invalid GitHub secret::QQ_BOT_AUTH_URL must start with http:// or https://"
              exit 1
            fi

            echo "🔗 Uploading QQ login bridge configuration..."
            npx wrangler secret put QQ_BOT_AUTH_URL --env="" <<< "$QQ_BOT_AUTH_URL"
            npx wrangler secret put CFORUM_AUTH_TOKEN --env="" <<< "$CFORUM_AUTH_TOKEN"
          else
            echo "⏭️  Skipping QQ login bridge configuration (not configured)"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          QQ_BOT_AUTH_URL: ${{ secrets.QQ_BOT_AUTH_URL }}
          CFORUM_AUTH_TOKEN: ${{ secrets.CFORUM_AUTH_TOKEN }}

      - name: Upload Resend secrets (optional)
        run: |
          if [ -n "$RESEND_KEY" ]; then
            echo "📧 Uploading Resend configuration..."
            npx wrangler secret put RESEND_KEY --env="" <<< "$RESEND_KEY"
            if [ -n "$RESEND_SEND" ]; then
              npx wrangler secret put RESEND_SEND --env="" <<< "$RESEND_SEND"
            fi
          else
            echo "⏭️  Skipping Resend configuration (not configured)"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          RESEND_SEND: ${{ secrets.RESEND_SEND }}

      - name: Upload SMTP secrets (optional)
        run: |
          if [ -n "$SMTP_HOST" ]; then
            echo "📧 Uploading SMTP configuration..."
            npx wrangler secret put SMTP_HOST --env="" <<< "$SMTP_HOST"
            npx wrangler secret put SMTP_PORT --env="" <<< "$SMTP_PORT"
            npx wrangler secret put SMTP_USER --env="" <<< "$SMTP_USER"
            npx wrangler secret put SMTP_PASS --env="" <<< "$SMTP_PASS"
            npx wrangler secret put SMTP_FROM --env="" <<< "$SMTP_FROM"
            if [ -n "$SMTP_FROM_NAME" ]; then
              npx wrangler secret put SMTP_FROM_NAME --env="" <<< "$SMTP_FROM_NAME"
            fi
          else
            echo "⏭️  Skipping SMTP configuration (not configured)"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}

      - name: Ensure Cloudflare Pages project exists
        run: |
          if npx wrangler pages project list | grep -q "cforum"; then
            echo "✅ Pages project 'cforum' already exists"
          else
            echo "🆕 Creating Pages project 'cforum'"
            npx wrangler pages project create cforum --production-branch main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Upload Pages Worker URL secret
        run: |
          set -euo pipefail

          if [ -z "$WORKER_URL" ]; then
            echo "::error title=Missing GitHub secret::WORKER_URL is not configured in GitHub repository secrets"
            exit 1
          fi

          if [[ "$WORKER_URL" != http* ]]; then
            echo "::error title=Invalid GitHub secret::WORKER_URL must start with http:// or https://"
            exit 1
          fi

          echo "🔗 Uploading Pages WORKER_URL configuration..."
          npx wrangler pages secret put WORKER_URL --project-name=cforum <<< "$WORKER_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_URL: ${{ secrets.WORKER_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy public --project-name=cforum

      - name: Success
        run: |
          echo "✅ 部署完成！"
          echo "📍 Pages: https://cforum.pages.dev (静态资源 - 免费无限)"
          echo "📍 Worker: https://cforum.workers.dev (API - 按需计费)"
          echo "💡 使用 GitHub Secrets 配置自定义域名"
